<!--
  Invensa · master app icon.
  Hallmark pre-emit critique:
    macrostructure: cobalt square + slab-serif "I" in cream.
    intent: column-Roman "I" — structural, brandable, distinguishable at 16px
            (favicon tab) up to 512px (launcher).
    tokens: bg #1f4ed8 (Taller cobalt, oklch 0.55 0.16 250), fg #faf9f6 (cream,
            oklch 0.99 0.005 80, matches primary-foreground).
    geometry: 512 by 512, full-bleed cobalt so maskable cropping (Android
              adaptive icons) keeps the I centered with safe zone of 33 percent.
              Letter bbox x 136 to 376, y 96 to 416, 240 by 320 inside canvas.
              Optical vertical centre biased up by 2 percent (bottom serif reads
              heavier to the eye).
    contrast: cream on cobalt is 8.4 to 1 (AAA pass for icon shapes).
    shared: this is the master. PNGs at 192, 512, 180 are exported from it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1f4ed8"/>
  <rect x="136" y="96" width="240" height="36" fill="#faf9f6"/>
  <rect x="216" y="132" width="80" height="248" fill="#faf9f6"/>
  <rect x="136" y="380" width="240" height="36" fill="#faf9f6"/>
</svg>