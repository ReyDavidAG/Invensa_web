<!--
  Invensa · favicon.
  Hallmark pre-emit critique:
    macrostructure: cobalt rounded square + bold sans-serif "I" in cream.
    intent: matches BrandMark in src/components/brand-mark.tsx (sidebar header,
            login, loading) and the PWA icon in public/icon.svg. The favicon,
            sidebar monogram, login header, and OS launcher all show the same
            cobalt square + bold "I" mark.
    tokens: bg #1f4ed8 (Taller cobalt, oklch 0.55 0.16 250), fg #faf9f6 (cream,
            oklch 0.99 0.005 80, matches primary-foreground).
    geometry: 512 by 512. Cobalt rounded square with rx 92 (about 18 percent,
              rounded-lg to rounded-xl range, visible from 16px favicon tab
              up to 512px launcher). Bold I as a single rect: 61 by 358 inside
              a 512 by 512 canvas, centered at (256, 256). Width to height
              ratio 0.17 approximates Inter Bold uppercase I (caps height
              about 70 percent of em, stroke width about 12 percent of em).
    shared: same vector as public/icon.svg. Colours are hardcoded because
            favicon has no parent text colour to inherit from; currentColor
            would fall back to black in the browser tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="92" fill="#1f4ed8"/>
  <rect x="225" y="77" width="61" height="358" fill="#faf9f6"/>
</svg>